<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre</title>
</head>
<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: crimson;
        padding: 40px 50px;
        text-align: center;
    }
    h1 {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 30px;
        text-align: center;
        color: gold;
        border-bottom: 2px solid;
        margin: 20px 40px;
    }

    .container {
        background-color: white;
        border-radius: 20px;
        padding: 8px 3px;
    }

   .container p {
        color: gold;
        text-align: center;
        margin: 30px 20px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .btn-voltar {
        display: inline-block;
        margin-top: 30px;
        background-color: white;
        padding:  20px;
        border-radius: 20px;
        transition: 0.2s ease;

    }

    .btn-voltar:hover {
        color: khaki;
        border-color: khaki;
        border: 4px solid;
    }
    .btn-voltar a {
        color: gold;
        text-decoration: none;
        font-weight: bold;
    }

</style>
<body>
    <h1>Este site é um site de exemplo</h1>
    <br>
<div class="container">
    <p>Neste site você encontrará apenas um exemplo de como é um site real e funcional.</p>

    <p>O objetivo principal é entender como funciona a navegação entre outras páginas dentro da página principal.</p>
</div>

<nav class="btn-voltar">
    <a href="atividade-flexbox.html" target="_self">Voltar para a Home</a>
</nav>

</html>
